<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1B2A6B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131522" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Rav Shekha Ji Yuva Club, Nangla" />

    <title>Rav Shekha Ji Yuva Club, Nangla</title>

    <!--
      Fonts are loaded from Google with full local fallbacks in theme.css.
      If the machine is offline the app still renders correctly, just in the
      fallback faces.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@300;400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap"
      rel="stylesheet"
    />

    <!--
      The club logo, also used as the browser tab icon and the icon a phone
      shows when the site is added to the home screen. The file lives at
      client/public/images/logo.jpeg. The drawn crest below is the fallback
      the browser uses if that file is ever missing.
    -->
    <link rel="icon" type="image/jpeg" href="/images/logo.jpeg" />
    <link rel="apple-touch-icon" href="/images/logo.jpeg" />
    <link
      rel="alternate icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2A6B'/%3E%3Cpath d='M16 5c5 0 8 3.4 8 8v14H8V13c0-4.6 3-8 8-8z' fill='none' stroke='%23E08A1E' stroke-width='2'/%3E%3Ccircle cx='16' cy='14' r='2.6' fill='%23E08A1E'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
